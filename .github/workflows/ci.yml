name: CI

# Кожен пуш і кожен PR. Ворота, які треба не забути запустити, — це ворота,
# які одного дня не запустять: до 2026-08-26 усі 2786 тестів існували, і
# жоден не виконувався автоматично.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Ворота приватності читають `git ls-files`, тож їм потрібен
          # справжній репозиторій, а не розпакований архів.
          #
          # 0, а не 1: другі ворота читають ПОВІДОМЛЕННЯ КОМІТІВ, і на
          # неглибокому клоні бачили б рівно один — верхівку. Зелень від
          # огляду однієї верхівки читалася б як «в історії нічого немає».
          # Ворота таку відмову ловлять і падають гучно, але платити за це
          # падінням щоразу немає сенсу: історія тут коротка.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Порядок навмисний: typecheck дешевший і падає виразніше, ніж
      # набір тестів, який на ту саму ваду відповів би десятком червоних
      # файлів.
      - name: Typecheck (src + tests, strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Збірка перевіряє те, чого не бачить жоден тест: що `tsc` справді
      # видає обидві bin-точки й що `copy:jsx` доносить активи, без яких
      # опублікований пакунок падає в рантаймі.
      - name: Build
        run: npm run build

      # `scripts/` не входить у tsconfig і не має тестів, але один зламаний
      # файл ламає `build:audit` або регресійний прогін. `node --check` на
      # .mjs працює (на відміну від .jsx — там розширення відхиляється) і
      # коштує секунду.
      - name: Допоміжні скрипти парсяться
        run: |
          set -euo pipefail
          for f in scripts/*.mjs; do node --check "$f"; done
          echo "перевірено $(ls scripts/*.mjs | wc -l | tr -d ' ') файлів"

      - name: Опубліковані активи на місці
        run: |
          set -euo pipefail
          for f in dist/server.js dist/cli/audit.js dist/cli/template/report.html; do
            test -f "$f" || { echo "немає $f"; exit 1; }
          done
          count=$(ls dist/jsx/*.jsx | wc -l)
          test "$count" -eq 18 || { echo "очікувалось 18 .jsx, є $count"; exit 1; }
          echo "дві bin-точки, шаблон і $count фрагментів JSX — на місці"

# Інтеграційний проєкт тут НЕ запускається, і це не недогляд: він керує
# живим InDesign на macOS, якого в CI немає. Мовчазний `continue-on-error`
# був би гірший за відсутність — зелений значок означав би «перевірено».
